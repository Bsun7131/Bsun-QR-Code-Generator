    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bsun QR Code Generator</title>

    <meta name="description"
          content="Generate QR codes for websites, text, email, phone numbers and Wi-Fi connections. Free browser-based QR code generator by Bisan Subba.">

    <link rel="stylesheet" href="style.css">

    <script src="qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <header>
            <h1>Bsun QR Code Generator</h1>
            <p class="developer">Developer: Bisan Subba</p>
            <p class="subtitle">
                Create QR codes instantly, directly in your browser.
            </p>
        </header>

        <section class="generator">

            <label for="qrType">Select QR Code Type</label>

            <select id="qrType">
                <option value="url">Website URL</option>
                <option value="text">Plain Text</option>
                <option value="email">Email Address</option>
                <option value="phone">Phone Number</option>
                
            </select>

            <div id="inputFields"></div>

            <label for="qrSize">QR Code Size</label>

            <select id="qrSize">
                <option value="200">200 × 200</option>
                <option value="300" selected>300 × 300</option>
                <option value="400">400 × 400</option>
                <option value="500">500 × 500</option>
            </select>

            <div class="color-options">
                <div>
                    <label for="foreground">QR Code Colour</label>
                    <input type="color" id="foreground" value="#000000">
                </div>

                <div>
                    <label for="background">Background Colour</label>
                    <input type="color" id="background" value="#ffffff">
                </div>
            </div>

            <div class="buttons">
                <button id="generateBtn" type="button">
                    Generate QR Code
                </button>

                <button id="clearBtn" type="button">
                    Clear All
                </button>
            </div>

        </section>

        <section class="result">
            <h2>Your QR Code</h2>

            <div id="qrcode"></div>
            <p class="qr-developer">Developed by Bisan Subba</p>

            <button id="downloadBtn" type="button" disabled>
                Download PNG
            </button>
        </section>

        <footer>
            <p>
                © 2026 Bisan Subba. All rights reserved.
            </p>
            <p>
                QR codes are generated locally in your browser.
            </p>
        </footer>

    </main>

</body>
</html>
